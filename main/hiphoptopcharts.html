<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Muzec - Hip-Hop Charts</title>
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body id="page-top">
  <div id="wrapper">
    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">

        <!-- Topbar -->
        <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top shadow align-items-center"
          style="background: linear-gradient(90deg, #B379E3 50%, #6EE7F2 70%);">
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="sidebar-brand d-flex align-items-center justify-content-center">
                <div class="sidebar-brand-icon">
                  <img class="img-profile rounded-circle" src="img/logo_only.png" style="width:90px;height:90px;">
                </div>
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-light btn-sm rounded-pill text-dark mx-1 px-2 py-1" href="index.html">
                <i class="fas fa-fw fa-home"></i> <span>Home</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-light btn-sm rounded-pill text-dark mx-1 px-2 py-1" href="topcharts.html">
                <i class="fas fa-fw fa-trophy"></i> <span>Top Charts</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="btn btn-light btn-sm rounded-pill text-dark mx-1 px-2 py-1" href="favorites.html">
                <i class="fas fa-fw fa-heart"></i> <span>Favorites</span>
              </a>
            </li>
          </ul>
          <ul class="navbar-nav ml-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="profile.html">
                <span class="mr-2 d-none d-lg-inline text-white"id="navUsername">Username</span>
                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
              </a>
            </li>
          </ul>
        </nav>

        <!-- Page Content -->
        <div class="container-fluid">

          <!-- Page Heading -->
          <div class="d-sm-flex align-items-center justify-content-between mb-4">
            <h1 class="h3 mb-0 text-gray-800">Hip-Hop Charts</h1>
          </div>

          <!-- Genre Filter Buttons -->
          <div class="mb-4">
            <a href="topcharts.html"         class="btn btn-outline-primary btn-sm mr-1 mb-1">All</a>
            <a href="poptopcharts.html"       class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="Pop">Pop</a>
            <a href="rocktopcharts.html"      class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="Rock">Rock</a>
            <a href="hiphoptopcharts.html"    class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="Hip-Hop">Hip-Hop</a>
            <a href="jazztopcharts.html"      class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="Jazz">Jazz</a>
            <a href="classicaltopcharts.html" class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="Classical">Classical</a>
            <a href="kpoptopcharts.html"      class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="K-Pop">K-Pop</a>
            <a href="rnbtopcharts.html"       class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="R&amp;B">R&amp;B</a>
            <a href="indietopcharts.html"     class="btn btn-sm mr-1 mb-1 Hip-Hop" data-genre="Indie">Indie</a>
          </div>

          <!-- Charts Table -->
          <div class="card shadow mb-4">
            <div class="card-header py-3">
              <h6 class="m-0 font-weight-bold text-primary">Top 20 Hip-Hop Songs</h6>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-bordered" width="100%" cellspacing="0">
                  <thead>
                    <tr>
                      <th style="width:60px;">#</th>
                      <th>Title</th>
                      <th>Artist</th>
                      <th>Album</th>
                      <th style="width:60px;"></th>
                    </tr>
                  </thead>
                  <tbody id="chartTableBody">
                    <tr>
                      <td colspan="5" class="text-center py-4">
                        <div class="spinner-border spinner-border-sm text-primary mr-2"></div>
                        Loading charts...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Footer -->
          <footer class="sticky-footer bg-white">
            <div class="container my-auto">
              <div class="copyright text-center my-auto">
                <span>Copyright &copy; 2026 Muzec. All Rights Reserved.</span>
              </div>
            </div>
          </footer>

        </div>
      </div>
    </div>
  </div>

  <a class="scroll-to-top rounded" href="#page-top">
    <i class="fas fa-angle-up"></i>
  </a>

  <!-- Scripts -->
  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="js/sb-admin-2.min.js"></script>
  <script type="module">
    import { populateGenreChart } from "./js/charts.js";
    document.addEventListener("DOMContentLoaded", () => populateGenreChart("Hip-Hop"));
  </script>

  <!-- Highlight active genre button -->
  <style>
    [data-genre="Hip-Hop"] { background-color: #4e73df; color: white; border-color: #4e73df; }
    [data-genre="Hip-Hop"]:hover { background-color: #2e59d9; border-color: #2e59d9; }
  </style>

</body>
</html>
