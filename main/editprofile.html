<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Muzec - Home</title>

    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top shadow align-items-center"
                    style="background: linear-gradient(90deg, #B379E3 50%, #6EE7F2 70%);">

                    <!-- Topbar Navbar -->
                    <ul class="navbar-nav align-items-center">

                        <li class="nav-item">
                            <a class="sidebar-brand d-flex align-items-center justify-content-center">
                                <div class="sidebar-brand-icon">
                                    <img class="img-profile rounded-circle" src="img/logo_only.png"
                                        style="width: 90px; height: 90px;">
                                </div>
                            </a>
                        </li>

                        <!-- Nav Item - Home -->
                        <li class="nav-item active">
                            <a class="btn btn-light btn-sm rounded-pill text-dark mx-1 px-2 py-1" href="index.html">
                                <i class="fas fa-fw fa-home"></i>
                                <span>Home</span>
                            </a>
                        </li>

                        <!-- Nav Item - Top Charts -->
                        <li class="nav-item">
                            <a class="btn btn-light btn-sm rounded-pill text-dark mx-1 px-2 py-1" href="topcharts.html">
                                <i class="fas fa-fw fa-trophy"></i>
                                <span>Top Charts</span>
                            </a>
                        </li>

                        <!-- Nav Item - Favorites -->
                        <li class="nav-item">
                            <a class="btn btn-light btn-sm rounded-pill text-dark mx-1 px-2 py-1" href="favorites.html">
                                <i class="fas fa-fw fa-heart"></i>
                                <span>Favorites</span>
                            </a>
                        </li>
                    </ul>

                    <!-- Topbar Right Side -->
                    <ul class="navbar-nav ml-auto align-items-center">

                        <!-- Nav Item - Profile -->
                        <li class="nav-item">
                            <a class="nav-link" href="profile.html">
                                <span class="mr-2 d-none d-lg-inline text-white" id="navUsername">Username</span>
                                <img class="img-profile rounded-circle" src="img/undraw_profile.svg">
                                <div class="dropdown-divider"></div>
                            </a>
                        </li>
                    </ul>
                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">
                    <h1 class="h3 mb-4 text-gray-800">Profile</h1>

                    <div class="row">

                        <!-- Account details-->
                        <div class="col-lg-6 mb-4">
                            <div class="card shadow mb-4">
                                <div class="card-header py-3">
                                    <h6 class="m-0 font-weight-bold text-primary">Account Details</h6>
                                </div>
                                <div class="card-body">
                                    <!-- Success/Error messages -->
                                    <div id="editSuccess" class="alert alert-success" style="display:none;"></div>
                                    <div id="editError" class="alert alert-danger" style="display:none;"></div>    

                                    <div class="mb-3">
                                        <label for="nameInput" class="form-label text-dark">Name:</label>
                                        <div class="row">
                                            <div class="col">
                                                <input type="text" class="form-control form-control-sm" id="firstNameInput"
                                                    placeholder="First Name">
                                            </div>
                                            <div class="col">
                                                <input type="text" class="form-control form-control-sm" id="lastNameInput"
                                                    placeholder="Last Name">
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="mb-3">
                                        <label class="form-label text-dark">Email:</label>
                                        <input type="email" class="form-control form-control-sm" 
                                         id="emailInput" placeholder="user@gmail.com">
                                        <small class="text-muted">Changing email requires your current password</small>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label text-dark">Current Password:</label>
                                        <input type="password" class="form-control form-control-sm" id="currentPasswordInput"
                                            placeholder="Required to change email or password">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label text-dark">New Password:</label>
                                        <input type="password" class="form-control form-control-sm" id="newPasswordInput"
                                            placeholder="Leave blank to keep current password">
                                    </div>

                                    <div class="d-flex justify-content-center">
                                        <button type="button" class="btn btn-primary" id="saveBtn">Save Changes</button>
                                    </div>

                                    <div class="d-flex justify-content-center mt-2">
                                        <button type="button" class="btn btn-danger" id="deleteAccountBtn">
                                            <i class="fas fa-trash"></i> Delete Account
                                        </button>
                                    </div>

                                    <!-- Confirmation div — hidden by default -->
                                    <div id="deleteConfirm" class="mt-3 p-3 border border-danger rounded" style="display:none;">
                                        <p class="text-danger text-center mb-2">
                                            <strong>Are you sure?</strong> This will permanently delete your account and all your data.
                                        </p>
                                        <div class="mb-3">
                                            <input type="password" class="form-control form-control-sm" 
                                                    id="deletePasswordInput"
                                                    placeholder="Enter your password to confirm">
                                        </div>
                                        <div class="d-flex justify-content-center gap-2">
                                            <button type="button" class="btn btn-danger btn-sm mr-2" id="confirmDeleteBtn">
                                                 Yes, Delete My Account
                                            </button>
                                            <button type="button" class="btn btn-secondary btn-sm" id="cancelDeleteBtn">
                                                Cancel
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- End of Page Content -->

                    <!-- Footer -->
                    <footer class="sticky-footer bg-white">
                        <div class="container my-auto">
                            <div class="copyright text-center my-auto">
                                <span>Copyright &copy; 2026 Muzec. All Rights Reserved.</span>
                            </div>
                        </div>
                    </footer>
                    <!-- End of Footer -->

                </div>
                <!-- End of Content Wrapper -->

            </div>
            <!-- End of Page Wrapper -->

            <!-- Scroll to Top Button-->
            <a class="scroll-to-top rounded" href="#page-top">
                <i class="fas fa-angle-up"></i>
            </a>

            <!-- Bootstrap core JavaScript-->
            <script src="vendor/jquery/jquery.min.js"></script>
            <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

            <!-- Firebase Configuration -->
            <script type="module" src="js/firebase-config.js"></script>
            <script type="module" src="js/editprofile.js"></script>

            <!-- Core plugin JavaScript-->
            <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

            <!-- Custom scripts for all pages-->
            <script src="js/sb-admin-2.min.js"></script>





</body>

</html>
